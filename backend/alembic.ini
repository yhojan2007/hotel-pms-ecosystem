[alembic]
script_location = alembic
sys_path = .

prepend_sys_path = .

# Usaremos la URL dinámica desde env.py leyendo app.core.config
sqlalchemy.url = postgresql+psycopg://pms_user:pms_password_secret@db:5432/hotel_pms_db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
