services:
  db:
    image: postgres:16-alpine
    container_name: hotel_pms_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pms_password_secret}
      POSTGRES_DB: ${POSTGRES_DB:-hotel_pms_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pms_user} -d ${POSTGRES_DB:-hotel_pms_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pms_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hotel_pms_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-pms_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-pms_password_secret}
      - POSTGRES_DB=${POSTGRES_DB:-hotel_pms_db}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-pms_user}:${POSTGRES_PASSWORD:-pms_password_secret}@db:5432/${POSTGRES_DB:-hotel_pms_db}
      - SYNC_DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-pms_user}:${POSTGRES_PASSWORD:-pms_password_secret}@db:5432/${POSTGRES_DB:-hotel_pms_db}
      - PROJECT_NAME=${PROJECT_NAME:-"Hotel PMS Ecosystem"}
      - API_V1_STR=${API_V1_STR:-/api/v1}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-1}
      - SECRET_KEY=${SECRET_KEY:-change_this_secret_key_for_production_demo}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - BACKEND_PUBLIC_URL=${BACKEND_PUBLIC_URL:-http://localhost:8000}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ZAVU_API_KEY=${ZAVU_API_KEY:-}
      - ZAVU_PHONE_NUMBER_ID=${ZAVU_PHONE_NUMBER_ID:-}
      - PAYMENT_WEBHOOK_SECRET=${PAYMENT_WEBHOOK_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pms_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws/rooms}
        API_INTERNAL_URL: ${API_INTERNAL_URL:-http://backend:8000}
    container_name: hotel_pms_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - API_INTERNAL_URL=${API_INTERNAL_URL:-http://backend:8000}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api/v1}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws/rooms}
    depends_on:
      - backend
    networks:
      - pms_network

volumes:
  postgres_data:

networks:
  pms_network:
    driver: bridge
